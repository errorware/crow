[plugin]
name = "aws"
display_name = "Amazon Web Services (EC2)"
kind = "provider"
category = "provider.hosts"
capabilities = ["instances.list", "instances.power", "instances.create", "snapshots"]

[[settings]]
key = "access_key_id"
label = "Access Key ID"
type = "secret"
required = true
help = "AWS IAM Access Key ID (e.g. AKIA...)."
docs_source = "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"

[[settings]]
key = "secret_access_key"
label = "Secret Access Key"
type = "secret"
required = true
help = "AWS IAM Secret Access Key paired with the Access Key ID."
docs_source = "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"

[[settings]]
key = "region"
label = "Default region"
type = "string"
required = true
default = "us-east-1"
help = "Primary AWS region for EC2 operations (e.g. us-east-1, eu-central-1, ap-northeast-1)."

[[settings]]
key = "extra_regions"
label = "Extra regions"
type = "string"
required = false
help = "Comma-separated list of additional regions to scan for instances (e.g. eu-central-1, us-west-2)."
