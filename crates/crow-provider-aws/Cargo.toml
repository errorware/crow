[package]
name = "crow-provider-aws"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["Nelson <nelson@errorware.net>"]
readme = "README.md"
description = "AWS EC2 provider for Crow: instances, power, EBS snapshots, and provisioning"
homepage = "https://crow.rs"
repository = "https://github.com/errorware/crow"

[dependencies]
crow-provider-core = { path = "../crow-provider-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
roxmltree = "0.20"
chrono = "0.4"

[dev-dependencies]
crow-provider-core = { path = "../crow-provider-core", version = "0.1.0", features = ["testing"] }
