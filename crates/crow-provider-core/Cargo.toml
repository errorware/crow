[package]
name = "crow-provider-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
authors = ["Nelson <nelson@errorware.net>"]
description = "Contracts for Crow's provider plugins: cloud hosts today, DNS next"
homepage = "https://crow.rs"
repository = "https://github.com/errorware/crow"

[features]
# A recorded-response HTTP fake for provider crates' tests.
testing = []

[dependencies]
crow-config-core = { path = "../../../crow-config-core/crow-config-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
