[package]
name = "crow-provider-upcloud"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
authors = ["Nelson <nelson@errorware.net>"]
readme = "README.md"
description = "UpCloud provider for Crow: servers and power"
homepage = "https://crow.rs"
repository = "https://github.com/errorware/crow"

[dependencies]
crow-provider-core = { path = "../crow-provider-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
crow-provider-core = { path = "../crow-provider-core", version = "0.1.0", features = ["testing"] }
