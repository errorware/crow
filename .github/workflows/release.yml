# Builds Crow release binaries for Linux (x86_64) and macOS (Apple Silicon)
# and attaches them, with SHA256SUMS, to the GitHub release. When the
# repository is public it also generates SLSA Build Level 3 provenance with
# the OpenSSF generic generator
# (https://github.com/slsa-framework/slsa-github-generator); verify those
# downloads with https://github.com/slsa-framework/slsa-verifier
#
# Run it manually (workflow_dispatch) to dry-run the builds without a release.

name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: crow-linux-x86_64
          - os: macos-latest
            asset: crow-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      # Crow depends on crow-config-core/crow-config-schemas via a sibling path
      # (../crow-config-core/...), so both repos are checked out side by side.
      - uses: actions/checkout@v7
        with:
          path: crow

      - uses: actions/checkout@v7
        with:
          repository: errorware/crow-config
          path: crow-config-core

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: crow
        run: cargo build --locked --release

      # Tarballs rather than bare files: artifact uploads and release downloads
      # drop the executable bit, a tar.gz keeps it.
      # Linux: the binary, its desktop entry and icons, and install.sh, which
      # puts them under ~/.local so launchers and docks show Crow's icon.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: crow
        run: |
          set -eu
          root="dist/${{ matrix.asset }}"
          mkdir -p "$root/share/applications" "$root/share/icons"
          cp target/release/crow packaging/linux/install.sh "$root/"
          cp packaging/linux/rs.crow.Crow.desktop "$root/share/applications/"
          cp -r packaging/linux/icons/hicolor "$root/share/icons/"
          # The distro logos are built in; their licence travels with them.
          mkdir -p "$root/licenses/distro-icons"
          cp assets/distro/LICENSE assets/distro/NOTICE.md "$root/licenses/distro-icons/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

      # macOS: a Crow.app bundle with its icon, ad-hoc signed (not notarized:
      # first launch needs right-click → Open).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: crow
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="dist/Crow.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/crow "$app/MacOS/crow"
          cp packaging/macos/AppIcon.icns "$app/Resources/"
          # The distro logos are built in; their licence travels with them.
          mkdir -p "$app/Resources/licenses/distro-icons"
          cp assets/distro/LICENSE assets/distro/NOTICE.md "$app/Resources/licenses/distro-icons/"
          # CFBundleVersion must be numeric: 0.2.0-beta.1 → 0.2.0.
          sed -e "s/@VERSION@/$version/g" -e "s/@BUILD@/${version%%-*}/g" packaging/macos/Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          codesign --force --deep --sign - dist/Crow.app
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist Crow.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: crow/dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # Matrix jobs can't merge outputs, so hashing happens once over every artifact.
  hash:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate subjects for provenance
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

  # SLSA provenance goes into Sigstore's public transparency log, which
  # names the repository, so the generator refuses private repositories
  # (ERR-101). It runs once the repository is public; until then releases
  # carry SHA256SUMS (below) instead.
  provenance:
    needs: [hash]
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance.
      contents: write  # To add assets to a release.
    # Must be referenced by tag, not commit SHA — the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: ${{ github.event_name == 'release' }} # Attach the .intoto.jsonl to the release.

  # The binaries go on the release whenever they built, whatever happens to
  # provenance (skipped while the repository is private, see above).
  release-assets:
    needs: [build, provenance]
    if: always() && github.event_name == 'release' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/SHA256SUMS --repo "${{ github.repository }}"
