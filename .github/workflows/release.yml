# Builds Crow release binaries for Linux (x86_64) and macOS (Apple Silicon),
# generates SLSA Build Level 3 provenance covering all of them with the OpenSSF
# generic generator (https://github.com/slsa-framework/slsa-github-generator),
# and attaches everything to the GitHub release.
# Verify downloads with https://github.com/slsa-framework/slsa-verifier
#
# Run it manually (workflow_dispatch) to dry-run the builds without a release.

name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: crow-linux-x86_64
          - os: macos-latest
            asset: crow-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      # Crow depends on crow-config-core/crow-config-schemas via a sibling path
      # (../crow-config-core/...), so both repos are checked out side by side.
      - uses: actions/checkout@v7
        with:
          path: crow

      - uses: actions/checkout@v7
        with:
          repository: errorware/crow-config
          path: crow-config-core

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      # Tarball rather than a bare binary: artifact uploads and release downloads
      # drop the executable bit, a tar.gz keeps it.
      - name: Build and package
        working-directory: crow
        run: |
          cargo build --locked --release
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C target/release crow

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: crow/dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # Matrix jobs can't merge outputs, so hashing happens once over every artifact.
  hash:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate subjects for provenance
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [hash]
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance.
      contents: write  # To add assets to a release.
    # Must be referenced by tag, not commit SHA — the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: ${{ github.event_name == 'release' }} # Attach the .intoto.jsonl to the release.

  release-assets:
    needs: [provenance]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz --repo "${{ github.repository }}"
