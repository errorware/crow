# Builds Crow release binaries for Linux (x86_64) and macOS (Apple Silicon
# and Intel)
# and attaches them, with SHA256SUMS, to the GitHub release. When the
# repository is public it also generates SLSA Build Level 3 provenance with
# the OpenSSF generic generator
# (https://github.com/slsa-framework/slsa-github-generator); verify those
# downloads with https://github.com/slsa-framework/slsa-verifier
#
# Run it manually (workflow_dispatch) to dry-run the builds without a release.

name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

# Least privilege: read the code. Jobs that need more ask for it.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Built inside an Ubuntu 22.04 container, not on the runner's own
          # OS: a binary needs the glibc it was linked against or newer, and
          # ubuntu-latest's glibc 2.43 locked out 24.04, Mint and Fedora 42
          # (issue #2). The container outlives the ubuntu-22.04 runner label
          # (retired April 2027).
          - os: ubuntu-24.04
            container: ubuntu:22.04
            asset: crow-linux-x86_64
            # Highest glibc symbol version the binary may need.
            max_glibc: "2.35"
          - os: macos-latest
            asset: crow-macos-arm64
          # Intel Macs, cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            asset: crow-macos-x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      # Before checkout: the bare container has no git or CA certificates.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential binutils pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      # Crow depends on crow-config-core/crow-config-schemas via a sibling path
      # (../crow-config-core/...), so both repos are checked out side by side.
      - uses: actions/checkout@v7
        with:
          path: crow

      - uses: actions/checkout@v7
        with:
          repository: errorware/crow-config
          path: crow-config-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: crow
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          if [ -n "$TARGET" ]; then
            cargo build --locked --release --target "$TARGET"
            mkdir -p target/release
            cp "target/$TARGET/release/crow" target/release/crow
          else
            cargo build --locked --release
          fi
          file target/release/crow || true

      # Fails the release if the binary would need a newer glibc than the
      # oldest one we promise (see the matrix), so issue #2 can't come back.
      - name: Check glibc baseline (Linux)
        if: runner.os == 'Linux'
        working-directory: crow
        env:
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          set -eu
          need=$(objdump -T target/release/crow | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Needs glibc $need (allowed: $MAX_GLIBC)"
          echo "Shared libraries:"
          objdump -p target/release/crow | grep NEEDED
          if [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::crow needs glibc $need, newer than the $MAX_GLIBC baseline"
            exit 1
          fi

      # Tarballs rather than bare files: artifact uploads and release downloads
      # drop the executable bit, a tar.gz keeps it.
      # Linux: the binary, its desktop entry and icons, and install.sh, which
      # puts them under ~/.local so launchers and docks show Crow's icon.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: crow
        run: |
          set -eu
          root="dist/${{ matrix.asset }}"
          mkdir -p "$root/share/applications" "$root/share/icons"
          cp target/release/crow packaging/linux/install.sh "$root/"
          cp packaging/linux/rs.crow.Crow.desktop "$root/share/applications/"
          cp -r packaging/linux/icons/hicolor "$root/share/icons/"
          # The distro logos are built in; their licence travels with them.
          mkdir -p "$root/licenses/distro-icons"
          cp assets/distro/LICENSE assets/distro/NOTICE.md "$root/licenses/distro-icons/"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

      # macOS: a Crow.app bundle with its icon, ad-hoc signed (not notarized:
      # first launch needs right-click → Open).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: crow
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="dist/Crow.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/crow "$app/MacOS/crow"
          cp packaging/macos/AppIcon.icns "$app/Resources/"
          # The distro logos are built in; their licence travels with them.
          mkdir -p "$app/Resources/licenses/distro-icons"
          cp assets/distro/LICENSE assets/distro/NOTICE.md "$app/Resources/licenses/distro-icons/"
          # CFBundleVersion must be numeric: 0.2.0-beta.1 → 0.2.0.
          sed -e "s/@VERSION@/$version/g" -e "s/@BUILD@/${version%%-*}/g" packaging/macos/Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          codesign --force --deep --sign - dist/Crow.app
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist Crow.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: crow/dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # The Linux binary starts on old and new distros. Crow links with full
  # RELRO (all symbols bound at load), and LD_BIND_NOW makes sure of it, so a
  # missing library or symbol fails here; --check-plugin needs no display.
  smoke-linux:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "fedora:latest"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install runtime libraries
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libfontconfig1 libfreetype6 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
          else
            dnf install -y fontconfig freetype libxcb libxkbcommon libxkbcommon-x11 libwayland-client
          fi

      - uses: actions/download-artifact@v8
        with:
          name: crow-linux-x86_64

      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: plugins

      - name: Run crow --check-plugin
        env:
          LD_BIND_NOW: "1"
        run: |
          set -eu
          tar -xzf crow-linux-x86_64.tar.gz
          ldd crow-linux-x86_64/crow
          crow-linux-x86_64/crow --check-plugin src/plugins/motd-note

  # Matrix jobs can't merge outputs, so hashing happens once over every artifact.
  hash:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate subjects for provenance
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

  # SLSA provenance goes into Sigstore's public transparency log, which
  # names the repository, so the generator refuses private repositories
  # (ERR-101). It runs once the repository is public; until then releases
  # carry SHA256SUMS (below) instead.
  provenance:
    needs: [hash]
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance.
      contents: write  # To add assets to a release.
    # Must be referenced by tag, not commit SHA — the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: ${{ github.event_name == 'release' }} # Attach the .intoto.jsonl to the release.

  # The binaries go on the release whenever they built, whatever happens to
  # provenance (skipped while the repository is private, see above).
  release-assets:
    needs: [build, smoke-linux, provenance]
    if: always() && github.event_name == 'release' && needs.build.result == 'success' && needs.smoke-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/SHA256SUMS --repo "${{ github.repository }}"
