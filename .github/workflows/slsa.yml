# Generates SLSA Build Level 3 provenance for Crow's release binary using the
# OpenSSF generic generator: https://github.com/slsa-framework/slsa-github-generator
# Verify downloaded artifacts with https://github.com/slsa-framework/slsa-verifier

name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: crow

      - uses: actions/checkout@v7
        with:
          repository: errorware/crow-config
          path: crow-config-core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: crow
        run: |
          cargo build --locked --release
          mkdir -p dist
          cp target/release/crow dist/crow-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: crow-linux-x86_64
          path: crow/dist/crow-linux-x86_64
          if-no-files-found: error

      - name: Generate subject for provenance
        id: hash
        working-directory: crow/dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum crow-linux-x86_64 | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance.
      contents: write  # To add assets to a release.
    # Must be referenced by tag, not commit SHA — the generator verifies its own ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true # Attach the .intoto.jsonl to the release.

  release-binary:
    needs: [build, provenance]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: crow-linux-x86_64

      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" crow-linux-x86_64 --repo "${{ github.repository }}"
