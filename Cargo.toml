[package]
name = "crow"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
authors = ["Nelson <nelson@errorware.net>"]

[dependencies]
gpui-kit = "0.6.1"
crow-config-core = { path = "../crow-config-core/crow-config-core" }
crow-config-schemas = { path = "../crow-config-core/crow-config-schemas" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
rand = "0.10.2"
dirs = "7.0.0"
toml = "0.8"
toml_edit = "0.22"
