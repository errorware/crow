[package]
# "crow" is taken on crates.io; the package is crow-rs (after crow.rs), the
# program it installs is still `crow`.
name = "crow-rs"
version = "0.7.0"
edition = "2021"
license-file = "LICENSE"
authors = ["Nelson <nelson@errorware.net>"]
description = "Agentless fleet manager for Linux servers over plain SSH: services, logs, configs, firewall, users"
homepage = "https://crow.rs"
repository = "https://github.com/errorware/crow"
keywords = ["ssh", "sysadmin", "fleet", "gui", "linux"]
categories = ["command-line-utilities", "gui"]

[workspace]
members = [".", "crates/*"]

[[bin]]
name = "crow"
path = "src/main.rs"

[features]
default = ["provider-linode", "provider-upcloud"]
# Provider plugins are compiled in; each one is a feature.
provider-linode = ["dep:crow-provider-linode"]
provider-upcloud = ["dep:crow-provider-upcloud"]

[dev-dependencies]
crow-provider-core = { path = "crates/crow-provider-core", version = "0.1.0", features = ["testing"] }

[dependencies]
crow-provider-core = { path = "crates/crow-provider-core", version = "0.1.0" }
crow-provider-linode = { path = "crates/crow-provider-linode", version = "0.1.0", optional = true }
crow-provider-upcloud = { path = "crates/crow-provider-upcloud", version = "0.1.0", optional = true }
gpui-kit = "0.6.1"
crow-config-core = { path = "../crow-config-core/crow-config-core", version = "0.1.0" }
crow-config-schemas = { path = "../crow-config-core/crow-config-schemas", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
# Config history hashes (already in the tree via ssh-key).
sha2 = "0.10"
libc = "0.2"
# The terminal's screen and PTY (ERR-92): Zed's fork of alacritty_terminal,
# Apache-2.0, pinned to a commit. Crow draws the screen itself.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f", default-features = false }
zeroize = { version = "1.9.0", features = ["derive"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth", "qr"] }
rand = "0.10.2"
dirs = "7.0.0"
# Personalisation: shrink and blur the Fleet background picture (already in the tree via gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
toml = "0.8"
toml_edit = "0.22"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "rand_core", "std", "getrandom", "crypto"] }
maxminddb = "0.32.0"
flate2 = "1.1.10"
semver = "1.0.28"
# Email notifications (ERR-139): SMTP over rustls (Fedora's curl has no SMTP).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls", "ring", "rustls-native-certs"] }
