# Runs on this machine and reaches servers itself, the way Ansible does:
# through the ssh_config Crow writes for the run.

format = 1

[plugin]
id = "local-reach"
name = "Reach over SSH"
version = "0.1.0"
author = "Errorware"
about = "From this machine, logs in to each server with Crow's own connection settings and reports its kernel and login user. A small example of an action on this machine."
crow = ">=0.8.3"
license = "MIT"
category = "inventory"

[requires]
local = ["python3", "ssh"]

[setup]
script = "setup.sh"
interpreter = "sh"
env = { VENV = "{data_dir}/venv", PACKAGE = "tabulate==0.9.0" }
timeout = "5m"

[[action]]
id = "reach"
label = "Reach"
on = "local"
effect = "read"
command = ["{data_dir}/venv/bin/python", "{plugin_dir}/reach.py", "{inventory}", "{ssh_config}", "{results}"]
timeout = "2m"

[action.output]
summary_prefix = "reached"
results = true

[[page]]
id = "reach"
label = "Reach"
icon = "network"
where = "server"

[[page.block]]
kind = "actions"
actions = ["reach"]

[[page.block]]
kind = "runs"

[[page]]
id = "reach-fleet"
label = "Reach over SSH"
icon = "network"
where = "fleet"

[[page.block]]
kind = "actions"
actions = ["reach"]

[[page.block]]
kind = "runs"
