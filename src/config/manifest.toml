[plugin]
name = "crow_config"
grammar = "toml"
category = "config.format"

[shape]
kind = "key_value_list"
order_sensitive = false
order_note = "Configuration values are organized by section."

[[fields]]
name = "general.theme"
type = "enum"
required = true
help = "Window appearance and accent palette."
options = [
  { value = "obsidian_edge", label = "Obsidian Edge", risk = "recommended" },
  { value = "slate_dark", label = "Slate Dark", risk = "recommended" }
]

[[fields]]
name = "general.font_family"
type = "string"
required = true
help = "Monospace font for all data grids, logs, and code views."

[[fields]]
name = "general.font_size"
type = "integer"
required = true
help = "Base font size across all views. UI scales proportionally."

[[fields]]
name = "general.refresh_interval"
type = "integer"
min = 1
max = 60
required = true
help = "Frequency of background polling in seconds for services and telemetry."

[[fields]]
name = "general.titlebar_latency"
type = "bool"
required = true
help = "Display round-trip ping latency to the active server in the titlebar."

[[fields]]
name = "general.confirm_destructive"
type = "bool"
required = true
help = "Require typed confirmation for restart, stop, and config rollback in PROD."

[[fields]]
name = "general.log_buffer_lines"
type = "integer"
required = true
help = "Maximum lines kept in memory per service before FIFO truncation."

[[fields]]
name = "general.notify_failures"
type = "bool"
required = true
help = "Send a desktop notification when any monitored service enters failed state."

[[fields]]
name = "general.auto_update_check"
type = "bool"
required = true
help = "Check for new releases on launch. Never installs without confirmation."

[[fields]]
name = "connection.strict_host_key_checking"
type = "bool"
required = true
help = "Refuse to connect when a host key changes. Unknown keys must be verified manually on first contact."

[[fields]]
name = "connection.agent_forwarding"
type = "bool"
required = true
help = "Forward your local agent into sessions. Convenient, and a lateral-movement risk on shared hosts."

[[fields]]
name = "connection.control_master"
type = "bool"
required = true
help = "Reuse one TCP connection per host for all panels. Reduces handshakes from ~14 to 1."

[[fields]]
name = "connection.keepalive_interval"
type = "integer"
min = 1
max = 3600
required = true
help = "Seconds between keepalive probes. Lower detects dead hosts faster, costs more chatter."

[[fields]]
name = "connection.connect_timeout"
type = "integer"
min = 1
max = 300
required = true
help = "Give up on a TCP handshake after this long."

[[fields]]
name = "connection.reconnect_backoff"
type = "enum"
required = true
help = "Delay curve between reconnect attempts after a drop."
options = [
  { value = "exponential", label = "exponential", risk = "recommended" },
  { value = "linear", label = "linear", risk = "recommended" },
  { value = "fixed", label = "fixed", risk = "caution" }
]

[[fields]]
name = "connection.ciphers"
type = "string"
required = true
help = "Restrict negotiation to modern AEAD ciphers only."

[[fields]]
name = "connection.compression"
type = "bool"
required = true
help = "Enable zlib compression for slow or metered links. Adds CPU overhead."

[[fields]]
name = "keys.default_identity"
type = "path"
required = true
help = "Default SSH private key offered during host authentication."

[[fields]]
name = "keys.auto_rotate_days"
type = "integer"
required = true
help = "Warning threshold in days before key rotation is recommended."

[[fields]]
name = "keys.enforce_ed25519_only"
type = "bool"
required = true
help = "Disallow legacy RSA or ECDSA keys across the fleet."

[[fields]]
name = "keys.agent_integration"
type = "bool"
required = true
help = "Query local 1Password / ssh-agent for available identities."

[[fields]]
name = "security.auto_lock_minutes"
type = "integer"
min = 0
max = 1440
required = true
help = "Lock vault and wipe decrypted keys from RAM after inactivity."

[[fields]]
name = "security.zeroize_on_drop"
type = "bool"
required = true
help = "Zeroize MasterKey from memory immediately on lock or exit."

[[fields]]
name = "appearance.fleet_background"
type = "string"
required = false
help = "Picture behind the Fleet server list (a copy kept in ~/.config/crow/backgrounds). Empty for none."

[[fields]]
name = "appearance.fleet_background_opacity"
type = "enum"
required = false
help = "How strongly the picture shows through. Low keeps the table easy to read."
options = [
  { value = "5", label = "5% · a hint", risk = "recommended" },
  { value = "10", label = "10% · subtle", risk = "recommended" },
  { value = "15", label = "15% · noticeable", risk = "recommended" },
  { value = "25", label = "25% · strong", risk = "recommended" },
  { value = "35", label = "35% · bold", risk = "recommended" }
]

[[fields]]
name = "appearance.fleet_background_blur"
type = "enum"
required = false
help = "Softens the picture so rows stay legible over it."
options = [
  { value = "0", label = "None", risk = "recommended" },
  { value = "4", label = "Light", risk = "recommended" },
  { value = "8", label = "Soft", risk = "recommended" },
  { value = "16", label = "Heavy", risk = "recommended" },
  { value = "32", label = "Frosted", risk = "recommended" }
]

[[fields]]
name = "servers.archive_purge_days"
type = "enum"
required = false
help = "How long an archived server keeps its stored data before Crow deletes it. The server record itself is never deleted."
options = [
  { value = "30", label = "30 days", risk = "recommended" },
  { value = "60", label = "60 days", risk = "recommended" },
  { value = "90", label = "90 days · default", risk = "recommended" },
  { value = "180", label = "180 days", risk = "recommended" },
  { value = "never", label = "Never purge", risk = "caution" }
]

[[fields]]
name = "appearance.terminal_font_size"
type = "integer"
required = false
min = 9
max = 24
help = "Font size in server terminals, in points."

[[fields]]
name = "servers.geoip_regions"
type = "bool"
required = false
help = "Find the country of servers without cloud metadata from their public IP, looked up on this machine in DB-IP's free country database (downloaded from db-ip.com about once a month; no server address is ever sent anywhere). IP geolocation by DB-IP (db-ip.com), CC BY 4.0."

[[fields]]
name = "general.update_check"
type = "bool"
required = false
help = "Check GitHub once a day for a newer Crow and say so next to the version. Only the release list is requested; nothing about you or your servers is sent."

[[fields]]
name = "general.update_prereleases"
type = "bool"
required = false
help = "Offer pre-releases (betas) too. Builds that are themselves pre-releases always see newer ones."

[[fields]]
name = "general.update_auto_install"
type = "bool"
required = false
help = "Download and install new versions by themselves, only after slsa-verifier confirms the release's signed provenance (it must be installed). Crow offers a restart and never restarts on its own."
